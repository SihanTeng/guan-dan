# Dependabot config (not a CI workflow).
# Opens version-bump PRs on a schedule; existing `.github/workflows/ci.yml`
# validates them like any other PR. See:
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # ── Cargo workspace (root Cargo.toml + lockfile) ─────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "rust"
    # Majors often break APIs (e.g. rand 0.9 → 0.10). Only propose
    # minor/patch; upgrade majors intentionally in a dedicated PR.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    # One PR for all safe bumps instead of a flood of singles.
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # ── Actions used by ci.yml / release.yml ─────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
