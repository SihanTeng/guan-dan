# Auto-merge Dependabot PRs that only bump minor/patch versions once CI
# is required to pass (enable branch protection + required status checks
# on main for `--auto` to wait; otherwise GitHub may merge as soon as
# allowed).
#
# Majors are never auto-merged — review those by hand.
# This is *not* a second test suite; CI remains `ci.yml`.

name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge (minor/patch)
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor/patch
        if: >
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # --auto: merge only after required checks succeed (when configured).
          gh pr merge --auto --squash "$PR_URL"

      - name: Skip majors (manual review)
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "Major update — not auto-merging. Review and merge manually after CI."
          echo "update-type=${{ steps.meta.outputs.update-type }}"
